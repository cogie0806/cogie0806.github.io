<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 開いた瞬間に（0秒後）指定したURLへ飛ばす -->
    <meta http-equiv="refresh" content="0;url=https://example.com">
    <title>ページを移動します</title>
</head>
<body>
    <p>自動的にページが移動します。移動しない場合は <a href="https://example.com">こちら</a> をクリックしてください。</p>
</body>
</html>
