// =========================
// 時計・挨拶
// =========================

function tokeiWoUgokasu(){

    const tz =
    document.getElementById("timezone-selector")?.value
    || "Asia/Tokyo";


    const options = {

        timeZone:tz,

        year:"numeric",
        month:"numeric",
        day:"numeric",

        hour:"numeric",
        minute:"numeric",
        second:"numeric",

        hour12:false

    };


    const parts =
    new Intl.DateTimeFormat(
        "ja-JP",
        options
    ).formatToParts(new Date());



    let year,month,date,h,m,s;



    parts.forEach(p=>{

        if(p.type==="year")
            year=p.value;

        if(p.type==="month")
            month=p.value.padStart(2,"0");

        if(p.type==="day")
            date=p.value.padStart(2,"0");

        if(p.type==="hour")
            h=p.value.padStart(2,"0");

        if(p.type==="minute")
            m=p.value.padStart(2,"0");

        if(p.type==="second")
            s=p.value.padStart(2,"0");

    });




    const name =
    document.getElementById("username-input")?.value.trim()
    || "ゲスト";



    const hour =
    Number(h);



    const hello =
    document.getElementById("aisatsu");



    if(hour>=5 && hour<11){

        hello.textContent =
        name+"、おはようございます！";

    }
    else if(hour>=11 && hour<18){

        hello.textContent =
        name+"、こんにちは！";

    }
    else{

        hello.textContent =
        name+"、こんばんは！";

    }



    const days =
    [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];



    const localDate =
    new Date(
        new Date().toLocaleString(
            "en-US",
            {timeZone:tz}
        )
    );



    document.getElementById("hizuke")
    .textContent =
    `${year}年${month}月${date}日（${days[localDate.getDay()]}）`;



    document.getElementById("tokei")
    .textContent =
    `${h}:${m}:${s}`;

}



setInterval(tokeiWoUgokasu,1000);

tokeiWoUgokasu();




// =========================

// =========================


function updateUsername(){

    const input =
    document.getElementById("username-input");


    localStorage.setItem(

    );


    tokeiWoUgokasu();

}



// =========================
// 設定開閉
// =========================


function toggleSettings(){

    const box =
    document.getElementById("setting-box");


    if(box.style.display==="none"){

        box.style.display="block";

    }
    else{

        box.style.display="none";

    }

}





// =========================
// 読み込み時
// =========================


window.addEventListener(
"DOMContentLoaded",
()=>{


    loadComments();


    const name =
    localStorage.getItem("cogie_username")
    || "ゲスト";


    document.getElementById(
        "username-input"
    ).value=name;



});




// =========================
// コメント
// =========================


function addComment(){


    const input =
    document.getElementById(
        "comment-input"
    );


    const text =
    input.value.trim();



    if(text==="")
        return;



    createCommentDOM(text);

    saveComment(text);


    input.value="";

}




function createCommentDOM(text){


    const div =
    document.createElement("div");


    div.className="comment-box";


    div.textContent=text;



    document
    .getElementById("comment-list")
    .prepend(div);


}




function saveComment(text){


    let list =
    JSON.parse(
        localStorage.getItem(
            "cogie_comments"
        )
    )
    || [];



    list.push(text);



    localStorage.setItem(
        "cogie_comments",
        JSON.stringify(list)
    );

}





function loadComments(){


    let list =
    JSON.parse(
        localStorage.getItem(
            "cogie_comments"
        )
    )
    || [];



    list.forEach(
        text=>createCommentDOM(text)
    );


}




function clearAllComments(){


    if(confirm(
    "コメントを全部消しますか？"
    )){


        localStorage.removeItem(
            "cogie_comments"
        );


        document
        .getElementById(
            "comment-list"
        )
        .innerHTML="";


    }


}





// =========================
// おみくじ
// =========================


function drawOmikuji(){


const kuji=[


{
result:"超大吉 🌟",
comment:"最高の1日になりそう！"
},


{
result:"大吉 🎯",
comment:"ラッキーなことが起きそう！"
},


{
result:"中吉 ✨",
comment:"楽しいことを見つけよう！"
},


{
result:"小吉 🍀",
comment:"ゆっくり過ごすと良い日！"
},


{
result:"吉 🌱",
comment:"努力が実る日！"
}


];



const r =
Math.floor(
Math.random()*kuji.length
);



document.getElementById(
"omikuji-result"
)
.textContent =
kuji[r].result;



document.getElementById(
"omikuji-comment"
)
.textContent =
kuji[r].comment;


}
